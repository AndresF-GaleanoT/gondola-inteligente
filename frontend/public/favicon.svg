<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rv-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c76a00"/>
      <stop offset="1" stop-color="#8a4600"/>
    </linearGradient>
  </defs>
  <!-- Fondo: insignia redondeada en el acento principal de la marca -->
  <rect width="64" height="64" rx="16" fill="url(#rv-bg)"/>
  <!-- Esquinas de encuadre: guiño a "vision" / deteccion por camara -->
  <g stroke="#fff8ee" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M10 18V12a2 2 0 0 1 2-2h6"/>
    <path d="M54 18V12a2 2 0 0 1-2-2h-6"/>
    <path d="M10 46v6a2 2 0 0 0 2 2h6"/>
    <path d="M54 46v6a2 2 0 0 1-2 2h-6"/>
  </g>
  <!-- Marca "R" de RetailVision -->
  <text x="32" y="43" text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="28" fill="#fff8ee">R</text>
</svg>
